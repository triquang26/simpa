[project]
name = "aslora"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch>=2.4,<2.6",
  "transformers>=4.45,<5.0",
  "accelerate>=1.0,<2.0",
  "datasets",
  "safetensors",
  "huggingface_hub",
  "wandb",
  "tqdm",
  "pandas",
  "einops",
  "pyyaml",
  "python-dotenv",
  "lm-eval[hf]",
  "tiktoken",
  # vendored mixlora installed as path dep (see [tool.uv.sources])
  "mixlora",
]

[tool.uv.sources]
mixlora = { path = "third_party/mixlora", editable = true }

[project.scripts]
aslora = "aslora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aslora"]
